<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Palette Roulette | Twatos Tools</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <header class="mini">
      <a class="back" href="../index.html">← All tools</a><br>
      <a class="logo small" href="../index.html">Twatos Tools</a>
    </header>
    <main class="workbench">
      <section class="tool-panel" id="panel-palette">
        <h2>Palette Roulette</h2>
        <p class="hint">Spin until something looks good, then copy the hex codes.</p>
        <button class="btn" id="palette-go">Spin</button>
        <div class="swatches" id="palette-out" style="margin-top:16px"></div>
      </section>
    </main>
    <footer><p>Everything runs in your browser. Nothing you type gets sent anywhere.</p></footer>
  </div>
  <script src="../common.js"></script>
  <script src="../js/palette.js"></script>
</body>
</html>
