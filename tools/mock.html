<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mocking Text | Twatos Tools</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <header class="mini">
      <a class="back" href="../index.html">← All tools</a><br>
      <a class="logo small" href="../index.html">Twatos Tools</a>
    </header>
    <main class="workbench">
      <section class="tool-panel" id="panel-mock">
        <h2>Mocking Text</h2>
        <p class="hint">Type anything. The result updates as you go.</p>
        <label for="mock-in">Your text</label>
        <textarea id="mock-in">I am definitely not being sarcastic</textarea>
        <div class="result big" id="mock-out"></div>
      </section>
    </main>
    <footer><p>Everything runs in your browser. Nothing you type gets sent anywhere.</p></footer>
  </div>
  <script src="../common.js"></script>
  <script src="../js/mock.js"></script>
</body>
</html>
