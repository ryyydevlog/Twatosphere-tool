<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dice Tumbler | Twatos Tools</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <header class="mini">
      <a class="back" href="../index.html">← All tools</a><br>
      <a class="logo small" href="../index.html">Twatos Tools</a>
    </header>
    <main class="workbench">
      <section class="tool-panel" id="panel-dice">
        <h2>Dice Tumbler</h2>
        <p class="hint">Choose how many dice, then roll.</p>
        <label for="dice-n">Number of dice</label>
        <select id="dice-n">
          <option>1</option>
          <option selected>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
        </select>
        <button class="btn" id="dice-go">Roll</button>
        <div class="result big" id="dice-out" style="font-size:3rem">🎲</div>
        <p class="big" id="dice-total"></p>
      </section>
    </main>
    <footer><p>Everything runs in your browser. Nothing you type gets sent anywhere.</p></footer>
  </div>
  <script src="../common.js"></script>
  <script src="../js/dice.js"></script>
</body>
</html>
