<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Password Blender | Twatos Tools</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <header class="mini">
      <a class="back" href="../index.html">← All tools</a><br>
      <a class="logo small" href="../index.html">Twatos Tools</a>
    </header>
    <main class="workbench">
      <section class="tool-panel" id="panel-pass">
        <h2>Password Blender</h2>
        <p class="hint">Slide to pick a length, then blend.</p>
        <label for="pass-len">Length: <span id="pass-len-val">16</span></label>
        <input type="range" id="pass-len" min="8" max="40" value="16">
        <button class="btn" id="pass-go">Blend a password</button>
        <button class="btn" id="pass-copy" style="background:var(--lime);color:#1b1340">Copy</button>
        <div class="result big" id="pass-out" style="font-family:monospace">Press the button.</div>
      </section>
    </main>
    <footer><p>Everything runs in your browser. Nothing you type gets sent anywhere.</p></footer>
  </div>
  <script src="../common.js"></script>
  <script src="../js/pass.js"></script>
</body>
</html>
