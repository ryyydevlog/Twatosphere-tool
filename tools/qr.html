<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QR Maker | Twatos Tools</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <header class="mini">
      <a class="back" href="../index.html">← All tools</a><br>
      <a class="logo small" href="../index.html">Twatos Tools</a>
    </header>
    <main class="workbench">
      <section class="tool-panel" id="panel-qr">
        <h2>QR Maker</h2>
        <p class="hint">Type a link or any text, then press the button.</p>
        <label for="qr-text">Text or link</label>
        <input type="text" id="qr-text" value="https://example.com">
        <button class="btn" id="qr-go">Make my QR</button>
        <!-- The library draws the QR code inside this box -->
        <div class="result" id="qr-out" style="display:grid;place-items:center">Your QR code shows up here.</div>
      </section>
    </main>
    <footer><p>Everything runs in your browser. Nothing you type gets sent anywhere.</p></footer>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../common.js"></script>
  <script src="../js/qr.js"></script>
</body>
</html>
