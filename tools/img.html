<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Image Flipper | Twatos Tools</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="wrap">
    <header class="mini">
      <a class="back" href="../index.html">← All tools</a><br>
      <a class="logo small" href="../index.html">Twatos Tools</a>
    </header>
    <main class="workbench">
      <section class="tool-panel" id="panel-img">
        <h2>Image Flipper</h2>
        <p class="hint">Pick an image and a format. Then save the result with a right-click (or long-press on a phone).
        </p>
        <label for="img-file">Image file</label>
        <input type="file" id="img-file" accept="image/*">
        <label for="img-fmt">Convert to</label>
        <select id="img-fmt">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WebP</option>
        </select>
        <button class="btn" id="img-go">Convert</button>
        <div class="result" id="img-out">Your converted image shows up here.</div>
      </section>
    </main>
    <footer><p>Everything runs in your browser. Nothing you type gets sent anywhere.</p></footer>
  </div>
  <script src="../common.js"></script>
  <script src="../js/img.js"></script>
</body>
</html>
