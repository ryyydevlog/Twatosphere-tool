<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover lets the page draw edge to edge on phones; safe-area padding in the CSS keeps text clear of notches -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Twatos Tools: silly tools that actually work</title>
  <link rel="icon" type="image/x-icon" href="icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- QR code library (pinned version). Used only by the QR tool. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="floaters" aria-hidden="true">
    <span style="left:6%;top:18%">🧩</span>
    <span style="left:88%;top:12%;animation-delay:-2s">🎲</span>
    <span style="left:78%;top:70%;animation-delay:-4s">✨</span>
    <span style="left:10%;top:76%;animation-delay:-1s">🔧</span>
    <span style="left:50%;top:92%;animation-delay:-3s">🍕</span>
  </div>
  <div class="wrap">

    <!-- ===== HOME VIEW: search, chips and the tool grid (cards are filled in by core.js) ===== -->
    <div id="view-home">
      <header>
        <div class="logo">Twatos Tools</div>
        <p class="tagline">A heap of small, slightly silly tools. Pick one, use it, forget we existed.</p>
      </header>
      <div class="search" role="search">
        <span aria-hidden="true">🔍</span>
        <input type="search" id="search" placeholder="Search tools: try “color” or “password”" aria-label="Search tools" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </div>
      <div class="chips" id="chips">
        <button class="chip" data-cat="all" aria-pressed="true">All</button>
        <button class="chip" data-cat="make" aria-pressed="false">Make</button>
        <button class="chip" data-cat="convert" aria-pressed="false">Convert</button>
        <button class="chip" data-cat="fun" aria-pressed="false">Just for fun</button>
      </div>
      <p class="count" id="count" aria-live="polite"></p>
      <nav class="grid" id="grid" aria-label="Tools"></nav>
      <p class="empty" id="empty" hidden>🫥 No tool matches that. Clear the search or try a shorter word.</p>
    </div>

    <!-- ===== TOOL VIEW: one tool panel is shown here at a time (panels are filled in by core.js) ===== -->
    <div id="view-tool" hidden>
      <header class="mini">
        <a class="back" href="#">← All tools</a><br>
        <a class="logo small" href="#">Twatos Tools</a>
      </header>
      <main class="workbench" id="bench" tabindex="-1"></main>
    </div>

    <footer><p>Everything runs in your browser. Nothing you type gets sent anywhere.</p></footer>
  </div>

  <!-- Tools first, core last (core reads the tools the other files registered) -->
  <script src="tools-make.js"></script>
  <script src="tools-convert.js"></script>
  <script src="tools-fun.js"></script>
  <script src="core.js"></script>
</body>
</html>
